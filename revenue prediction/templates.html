<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise Revenue Predictor</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
    label { display: grid; gap: .35rem; }
    input { padding: .55rem; }
    button { padding: .7rem 1rem; cursor: pointer; }
    .result { margin-top: 1.5rem; padding: 1rem; background: #eef7ee; }
    .note { color: #555; }
  </style>
</head>
<body>
  <h1>Enterprise Revenue Predictor</h1>
  <p class="note">Enter known enterprise details. Leave unavailable fields blank.</p>

  <form method="post" action="/predict">
    {% for field in fields %}
      <label>
        {{ field.label }}
        <input
          name="{{ field.name }}"
          type="{{ field.kind }}"
          {% if field.kind == "number" %}step="any"{% endif %}
        >
      </label>
    {% endfor %}
    <button type="submit">Predict revenue</button>
  </form>

  {% if prediction %}
    <section class="result">
      <strong>Predicted {{ target_name }}:</strong> {{ prediction }}
      <p class="note">The result uses the same currency and units as the training data.</p>
    </section>
  {% endif %}
</body>
</html>
